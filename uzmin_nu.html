<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzmini īsto ciparu šmurguli</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            margin: 10px 0;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .message {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>Uzmini nu!</h1>
    <p>uznimi skaitli no<strong>1</strong> līdz <strong>100</strong>.</p>
    <input type="number" id="uzmini" placeholder="ieraksti savu minējumu" />
    <button id="uzmini"> </button> ieraksti savu minējumu</button>
    <p class="message" id="message"></p>
    <script src="script.js"></script>
</body>
</html>

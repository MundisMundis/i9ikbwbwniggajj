<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>JavaScript Viktorīna</h2>
    <p>Cik cilvēku ir pasaulē?</p>
    <input type="text" id="lol">
    <button onclick="checkAnswer()">Pārbaudīt</button>
    <p id="feedback"></p>
   
   <script>
        function checkAnswer() {
            var answer = document.getElementById("lol").value;
            var feedback = document.getElementById("feedback");


            if (answer === "8 miljardi") {
                feedback.innerHTML = "Pareizi!";
                feedback.style.color = "green";
            } else {
                feedback.innerHTML = "Nepareizi, mēģini vēlreiz.";
                feedback.style.color = "red";
            }
        }


</script>
